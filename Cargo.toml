[workspace]
members = ["crates/layout", "packages/*/native"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"
ruyo-layout = { path = "crates/layout" }

[profile.release]
opt-level = 3
lto = true
strip = true
